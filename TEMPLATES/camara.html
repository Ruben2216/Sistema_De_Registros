<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CÁMARA</title>
    <link rel="stylesheet" href="/RESOURCE/CSS/camara.css">
    <link rel="stylesheet" href="/RESOURCE/CSS/index.css">
    <link rel="stylesheet" href="/RESOURCE/CSS/progreso_circular-pdf.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="icon" href="/RESOURCE/IMG/logo.png" type="image/x-icon">   

    <!-- Configuración dinámica de API -->
    <script src="/RESOURCE/JS/api_config.js"></script>
    
    <!-- Sistema de limpieza automática -->
    <script src="/RESOURCE/JS/limpieza_automatica.js"></script>
    <script src="/RESOURCE/JS/integracion_limpieza.js"></script>
    <script src="/RESOURCE/JS/forzarCargaCSS.js"></script>
    
    <script>
        // Configurar PDF.js worker
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    </script>
    
    <style>
        /* Mejorar comportamiento de botones en móviles - SOLO CLICK */
        .boton {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            /* Deshabilitar todos los efectos visuales automáticos */
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Solo feedback cuando el usuario mantenga presionado intencionalmente */
        .boton:hover:active {
            background-color: rgba(0, 123, 255, 0.8) !important;
            transform: scale(0.98);
            transition: all 0.1s ease;
        }
    </style>

</head>
<body>
    <div class="container">
        <h1>Cámara Móvil</h1>
        
        <div class="video-container">
            <video id="video" autoplay playsinline></video>
            <!-- Overlay para mostrar estado de procesamiento -->
            <div id="video-overlay" class="video-overlay" style="display: none;">
                <div class="overlay-content">
                    <div class="overlay-spinner"></div>
                    <p class="overlay-message">Tomando foto...</p>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="startButton">Iniciar</button>
            <button id="snapButton" disabled>Tomar Foto</button>
            <button id="stopButton" disabled>Apagar camara</button> 
            <button id="clearButton" disabled>Limpiar fotos</button> 
        </div>

        <!-- Checkbox para elegir el modo de fotos en PDF -->
        <div class="campo" style="margin: 10px 0;">
            <input type="checkbox" id="pantallaCompletaPDF" />
            <label for="pantallaCompletaPDF">Mostrar evidencia en hoja completa (PDF)</label>
           
        </div>

        <!-- Contenedor para mostrar imagen RIJ -->
        <div id="contenedor-rij" style="display: none; margin-bottom: 20px;">
            <h3>Reunión de Inicio de Jornada (RIJ)</h3>
            <div id="imagen-rij-container">
                <!-- Aquí se mostrará la imagen del RIJ -->
            </div>
        </div>

        <div class="output">
            <h2>Fotos Capturadas</h2> 
            <canvas id="canvas" style="display:none;"></canvas>
            <div id="photosContainer">
                <!--  imagenes capturadas -->
            </div>
        </div>
        
        <!-- El botón de PDF se inicia deshabilitado y se habilita cuando OpenCV.js esté listo -->
        <button id="btnGenerarPDF"  class= "boton boton--primario" disabled>Generar PDF de fotos</button>
        <button id="btnEnviarCorreo" class="boton boton--primario" disabled>Enviar a correo</button>
        <div class="boton boton--secundario boton--cancelar">

        <a href="/TEMPLATES/formato_RIJ.html" class="boton--secundario" id="link-formulario">Ir al formulario</a> 
    </div> 
        <p id="status"></p>
    </div>

    <!-- Caja de confirmación personalizada -->
    <div id="confirmBox" class="confirm-box" style="display:none; /* Ocultar por defecto con CSS */">
        <p id="confirmText" class="text-gray-800 text-lg mb-4"></p>
        <div class="confirm-buttons">
            <button id="confirmNo" class="bg-gray-500 hover:bg-gray-600 text-white">No</button>
            <button id="confirmYes" class="bg-red-600 hover:bg-red-700 text-white">Sí</button>
        </div>
    </div>

    <!-- Modal para indicador de tomar foto -->
    <div id="modal-tomar-foto" class="firma-modal" style="display: none;">
        <div class="firma-modal__contenido" style="text-align: center; padding: 30px;">
            <div class="circular-progress-foto">
                <div class="circular-progress-inner-foto"></div>
            </div>
            <h3 id="mensaje-tomar-foto" class="firma-modal__titulo" style="margin-top: 20px;">Tomando foto...</h3>
        </div>
    </div>

    <!-- Modal para enviar correo -->
    <div id="modal-enviar-correo-camara" class="firma-modal" style="display: none;">
        <div class="firma-modal__contenido">
            <h3 class="firma-modal__titulo">Enviar PDF por correo electrónico</h3>
            <div class="campo">
                <label class="campo__etiqueta" for="correo-destinatario-camara">Correo del destinatario:</label>
                <input type="email" 
                       id="correo-destinatario-camara" 
                       class="campo__control" 
                       placeholder="ejemplo@correo.com"
                       required>
            </div>
            <div class="campo">
                <label class="campo__etiqueta" for="nombre-archivo-pdf-camara">Nombre del archivo:</label>
                <input type="text" 
                       id="nombre-archivo-pdf-camara" 
                       class="campo__control" 
                       value="Evidencias_Fotograficas.pdf"
                       required>
            </div>
            <div class="firma-modal__botones">
                <button type="button" id="btn-enviar-correo-camara" class="boton boton--primario">Enviar</button>
                <button type="button" id="btn-cerrar-modal-correo-camara" class="boton boton--secundario">Cancelar</button>
            </div>
            <div id="mensaje-envio-correo-camara" class="mensaje-estado" style="display: none;"></div>
        </div>
    </div>

    <script>
        let currentConfirmCallback = null;

        function showConfirm(message, onConfirm, onCancel) {
            const confirmBox = document.getElementById('confirmBox');
            const confirmText = document.getElementById('confirmText');
            confirmText.textContent = message;
            confirmBox.style.display = 'block';
            currentConfirmCallback = { onConfirm, onCancel };
        }

        document.getElementById('confirmYes').addEventListener('click', function() {
            document.getElementById('confirmBox').style.display = 'none';
            if (currentConfirmCallback && typeof currentConfirmCallback.onConfirm === 'function') {
                currentConfirmCallback.onConfirm();
            }
            currentConfirmCallback = null;
        });

        document.getElementById('confirmNo').addEventListener('click', function() {
            document.getElementById('confirmBox').style.display = 'none';
            if (currentConfirmCallback && typeof currentConfirmCallback.onCancel === 'function') {
                currentConfirmCallback.onCancel();
            }
            currentConfirmCallback = null;
        });

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('confirmBox').style.display = 'none';
        });
    </script>

    <!-- Sistema robusto de carga de OpenCV.js con reintentos automáticos -->
    <script src="/RESOURCE/JS/opencv_loader.js"></script>
    
    <!-- Carga jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- SISTEMA DE CONTROL DE TAMAÑO PDF - Cargar ANTES de pdf_fotos.js -->
    <script src="/RESOURCE/JS/configuracion_pdf.js"></script>
    
    <!-- pdf_fotos.js se carga dinámicamente después de OpenCV.js -->
    <script src="/RESOURCE/JS/insertar_rij_en_camara.js"></script>
    <script src="/RESOURCE/JS/modal_tomar_foto.js"></script>
    <script src="/RESOURCE/JS/circular_progress_pdf.js"></script>
    <script src="/RESOURCE/JS/fotos_upload.js"></script>
    <script src="/RESOURCE/JS/autoguardado_camara.js"></script>
    <script src="/RESOURCE/JS/rij_pdf_a_imagen.js"></script>

    <!-- Sistema de monitoreo y recuperación automática -->
    <script src="/RESOURCE/JS/monitor_recuperacion.js"></script>
    
    <!-- Scripts principales de la aplicación -->
    <script src="/RESOURCE/JS/index.js"></script>
    <script src="/RESOURCE/JS/editar_foto.js"></script>
    <script src="/RESOURCE/JS/recorte_foto.js"></script>
    <script src="/RESOURCE/JS/pdfNombradoArchivos.js"></script>
    <script src="/RESOURCE/JS/envio_correo_camara.js"></script>



    <!-- Sistema de notificaciones mejorado -->
    <script src="/RESOURCE/JS/sistema_notificaciones.js"></script>
    
    <!-- Script de inicialización cuando OpenCV esté listo -->
    <script>
        // Configurar la inicialización cuando OpenCV esté disponible
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar si el loader ya está disponible
            if (window.opencvLoader) {
                configurarCallbacksOpenCV();
            } else {
                // Esperar a que el loader esté disponible
                const esperarLoader = setInterval(() => {
                    if (window.opencvLoader) {
                        clearInterval(esperarLoader);
                        configurarCallbacksOpenCV();
                    }
                }, 100);
            }
        });

        function configurarCallbacksOpenCV() {
            // Callback cuando OpenCV se carga exitosamente
            window.opencvLoader.onSuccess(function() {
                
                // Habilitar botones que dependen de OpenCV
                const btnGenerarPDF = document.getElementById('btnGenerarPDF');
                if (btnGenerarPDF) {
                    btnGenerarPDF.disabled = false;
                    btnGenerarPDF.textContent = 'Generar PDF de fotos';
                }

                const btnEnviarCorreo = document.getElementById('btnEnviarCorreo');
                if (btnEnviarCorreo) {
                    btnEnviarCorreo.disabled = false;
                }

                // Inicializar otros sistemas que dependen de OpenCV
                if (typeof inicializarSistemaFotos === 'function') {
                    inicializarSistemaFotos();
                }
            });

            // Callback cuando OpenCV falla al cargar
            window.opencvLoader.onError(function() {
                
                // Habilitar funcionalidades básicas
                const btnGenerarPDF = document.getElementById('btnGenerarPDF');
                if (btnGenerarPDF) {
                    btnGenerarPDF.disabled = false;
                    btnGenerarPDF.textContent = 'Generar PDF (modo básico)';
                    btnGenerarPDF.title = 'Algunas funciones de procesamiento no estarán disponibles';
                }

                // Mostrar mensaje informativo al usuario
                if (typeof showMessage === 'function') {
                    showMessage('Sistema cargado en modo básico. Algunas funciones de procesamiento de imagen pueden no estar disponibles.');
                }
            });
        }

        // Función de utilidad para verificar si OpenCV está disponible
        function verificarOpenCVDisponible() {
            return window.cv && window.cv.Mat && typeof window.cv.Mat === 'function';
        }

        // Función mejorada de showMessage si no existe
        if (typeof showMessage === 'undefined') {
            window.showMessage = function(message) {
                
                // Crear un modal simple para mostrar mensajes
                const modal = document.createElement('div');
                modal.style.cssText = `
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    background: white;
                    padding: 20px;
                    border-radius: 8px;
                    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
                    z-index: 10001;
                    max-width: 400px;
                    text-align: center;
                    font-family: Arial, sans-serif;
                `;
                
                modal.innerHTML = `
                    <p style="margin: 0 0 15px 0; color: #333;">${message}</p>
                    <button onclick="this.parentElement.remove()" style="
                        background: #007cba;
                        color: white;
                        border: none;
                        padding: 8px 16px;
                        border-radius: 4px;
                        cursor: pointer;
                    ">Entendido</button>
                `;
                
                document.body.appendChild(modal);
                
                // Auto-remover después de 5 segundos
                setTimeout(() => {
                    if (modal.parentElement) {
                        modal.remove();
                    }
                }, 5000);
            };
        }
    </script>
    
    <!-- Sistema de Control de Sesión -->
    <script src="/RESOURCE/JS/control_sesion.js"></script>
</body>
</html>
