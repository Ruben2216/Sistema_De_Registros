<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CÁMARA</title>
    <link rel="stylesheet" href="/RESOURCE/CSS/camara.css">
    <link rel="stylesheet" href="/RESOURCE/CSS/index.css">
    <link rel="stylesheet" href="/RESOURCE/CSS/progreso_circular-pdf.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Configurar PDF.js worker
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    </script>


</head>
<body>
    <div class="container">
        <h1>Cámara Móvil</h1>
        
        <div class="video-container">
            <video id="video" autoplay playsinline></video>
            <!-- Overlay para mostrar estado de procesamiento -->
            <div id="video-overlay" class="video-overlay" style="display: none;">
                <div class="overlay-content">
                    <div class="overlay-spinner"></div>
                    <p class="overlay-message">Tomando foto...</p>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="startButton">Iniciar</button>
            <button id="snapButton" disabled>Tomar Foto</button>
            <button id="stopButton" disabled>Apagar camara</button> 
            <button id="clearButton" disabled>Limpiar fotos</button> 
        </div>

        <!-- Checkbox para elegir el modo de fotos en PDF -->
        <div class="campo" style="margin: 10px 0;">
            <input type="checkbox" id="pantallaCompletaPDF" />
            <label for="pantallaCompletaPDF">Mostrar evidencia en hoja completa (PDF)</label>
           
        </div>

        <!-- Contenedor para mostrar imagen RIJ -->
        <div id="contenedor-rij" style="display: none; margin-bottom: 20px;">
            <h3>Reunión de Inicio de Jornada (RIJ)</h3>
            <div id="imagen-rij-container">
                <!-- Aquí se mostrará la imagen del RIJ -->
            </div>
        </div>

        <div class="output">
            <h2>Fotos Capturadas</h2> 
            <canvas id="canvas" style="display:none;"></canvas>
            <div id="photosContainer">
                <!--  imagenes capturadas -->
            </div>
        </div>
        
        <!-- El botón de PDF se inicia deshabilitado y se habilita cuando OpenCV.js esté listo -->
        <button id="btnGenerarPDF"  class= "boton boton--primario" disabled>Generar PDF de fotos</button>
        <button id="btnEnviarCorreo" class="boton boton--primario" disabled>Enviar a correo</button>
        <div class="boton boton--secundario boton--cancelar">

        <a href="/TEMPLATES/formato_RIJ.html" class="boton--secundario" id="link-formulario">Ir al formulario</a> 
    </div> 
        <p id="status"></p>
    </div>

    <!-- Caja de confirmación personalizada -->
    <div id="confirmBox" class="confirm-box" style="display:none; /* Ocultar por defecto con CSS */">
        <p id="confirmText" class="text-gray-800 text-lg mb-4"></p>
        <div class="confirm-buttons">
            <button id="confirmNo" class="bg-gray-500 hover:bg-gray-600 text-white">No</button>
            <button id="confirmYes" class="bg-red-600 hover:bg-red-700 text-white">Sí</button>
        </div>
    </div>

    <!-- Modal para indicador de tomar foto -->
    <div id="modal-tomar-foto" class="firma-modal" style="display: none;">
        <div class="firma-modal__contenido" style="text-align: center; padding: 30px;">
            <div class="circular-progress-foto">
                <div class="circular-progress-inner-foto"></div>
            </div>
            <h3 id="mensaje-tomar-foto" class="firma-modal__titulo" style="margin-top: 20px;">Tomando foto...</h3>
        </div>
    </div>

    <!-- Modal para enviar correo -->
    <div id="modal-enviar-correo-camara" class="firma-modal" style="display: none;">
        <div class="firma-modal__contenido">
            <h3 class="firma-modal__titulo">Enviar PDF por correo electrónico</h3>
            <div class="campo">
                <label class="campo__etiqueta" for="correo-destinatario-camara">Correo del destinatario:</label>
                <input type="email" 
                       id="correo-destinatario-camara" 
                       class="campo__control" 
                       placeholder="ejemplo@correo.com"
                       required>
            </div>
            <div class="campo">
                <label class="campo__etiqueta" for="nombre-archivo-pdf-camara">Nombre del archivo:</label>
                <input type="text" 
                       id="nombre-archivo-pdf-camara" 
                       class="campo__control" 
                       value="Evidencias_Fotograficas.pdf"
                       required>
            </div>
            <div class="firma-modal__botones">
                <button type="button" id="btn-enviar-correo-camara" class="boton boton--primario">Enviar</button>
                <button type="button" id="btn-cerrar-modal-correo-camara" class="boton boton--secundario">Cancelar</button>
            </div>
            <div id="mensaje-envio-correo-camara" class="mensaje-estado" style="display: none;"></div>
        </div>
    </div>

    <script>
        let currentConfirmCallback = null;

        function showConfirm(message, onConfirm, onCancel) {
            const confirmBox = document.getElementById('confirmBox');
            const confirmText = document.getElementById('confirmText');
            confirmText.textContent = message;
            confirmBox.style.display = 'block';
            currentConfirmCallback = { onConfirm, onCancel };
        }

        document.getElementById('confirmYes').addEventListener('click', function() {
            document.getElementById('confirmBox').style.display = 'none';
            if (currentConfirmCallback && typeof currentConfirmCallback.onConfirm === 'function') {
                currentConfirmCallback.onConfirm();
            }
            currentConfirmCallback = null;
        });

        document.getElementById('confirmNo').addEventListener('click', function() {
            document.getElementById('confirmBox').style.display = 'none';
            if (currentConfirmCallback && typeof currentConfirmCallback.onCancel === 'function') {
                currentConfirmCallback.onCancel();
            }
            currentConfirmCallback = null;
        });

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('confirmBox').style.display = 'none';
        });
    </script>

    <script>
        // Temporizador para detectar si OpenCV.js tarda demasiado en cargar
        var opencvTimeout = setTimeout(function() {
            showMessage('Error: OpenCV.js no se ha cargado después de 30 segundos. Por favor, verifica tu conexión o recarga la página.');
        }, 30000);

        // Función para cargar pdf_fotos.js dinámicamente
        function cargarPDFfotosJS() {
            var script = document.createElement('script');
            script.src = '/RESOURCE/JS/pdf_fotos.js';
            script.onload = function() {
                // Puedes poner aquí un mensaje de éxito si lo deseas
            };
            script.onerror = function() {
                showMessage('Error: No se pudo cargar pdf_fotos.js');
            };
            document.body.appendChild(script);
        }
    </script>

    <!-- Carga OpenCV.js (local) de forma síncrona y con onload/onerror -->
    <script src="/RESOURCE/opencv/opencv.js" onload="clearTimeout(opencvTimeout); cargarPDFfotosJS();" onerror="showMessage('Error: No se pudo cargar OpenCV.js');"></script>
    
    <!-- Carga jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- pdf_fotos.js se carga dinámicamente después de OpenCV.js -->
    <script src="/RESOURCE/JS/insertar_rij_en_camara.js"></script>
    <script src="/RESOURCE/JS/modal_tomar_foto.js"></script>
    <script src="/RESOURCE/JS/circular_progress_pdf.js"></script>
    <script src="/RESOURCE/JS/fotos_upload.js"></script>
    <script src="/RESOURCE/JS/autoguardado_camara.js"></script>
    <script src="/RESOURCE/JS/rij_pdf_a_imagen.js"></script>

    <script src="/RESOURCE/JS/index.js"></script>
    <script src="/RESOURCE/JS/editar_foto.js"></script>
    <script src="/RESOURCE/JS/recorte_foto.js"></script>
    <script src="/RESOURCE/JS/importar_imagenes.js?v=3"></script>
    <script src="/RESOURCE/JS/envio_correo_camara.js"></script>
    <!-- Script de diagnóstico temporal -->
    <script src="/RESOURCE/JS/diagnostico_modal_progreso.js"></script>
</body>
</html>
