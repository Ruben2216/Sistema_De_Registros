<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug RIJ - Simular Frontend</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <h1>Debug RIJ - Simular el mismo flujo del frontend</h1>
    <button id="simular-generacion">Simular Generación PDF desde formato_RIJ.html</button>
    <div id="output"></div>
    
    <script>
        document.getElementById('simular-generacion').addEventListener('click', async function() {
            const output = document.getElementById('output');
            output.innerHTML = '<h3>🔄 Iniciando simulación del flujo RIJ...</h3>';
            
            try {
                // 1. Crear un PDF similar al generado en formato_RIJ.html
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                // Simular contenido similar al del formulario real
                doc.setFontSize(11);
                doc.setFont("helvetica", "bold");
                doc.text("LISTA DE VERIFICACIÓN DE LA REUNIÓN DIARIA DE INICIO DE JORNADA", 105, 15, null, null, "center");
                
                doc.setFont("helvetica", "normal");
                doc.setFontSize(9);
                doc.text("DEPARTAMENTO: Prueba", 15, 30);
                doc.text("NOMBRE: Usuario de Prueba", 15, 40);
                doc.text("RPE: 12345", 15, 50);
                doc.text("FECHA: " + new Date().toLocaleDateString(), 15, 60);
                
                // Agregar más contenido para simular un formulario real
                let y = 80;
                doc.text("1. INICIO DE JORNADA:", 15, y);
                doc.text("   ☑ SÍ", 25, y + 10);
                y += 30;
                
                doc.text("2. PERSONAL PRESENTE:", 15, y);
                doc.text("   ☑ SÍ", 25, y + 10);
                y += 30;
                
                // Más contenido...
                for (let i = 3; i <= 10; i++) {
                    doc.text(`${i}. PREGUNTA ${i}:`, 15, y);
                    doc.text("   ☑ SÍ", 25, y + 10);
                    y += 25;
                }
                
                // 2. Obtener el PDF como data URI (igual que en el frontend)
                const pdfDataUri = doc.output('datauristring');
                
                output.innerHTML += '<p>✅ PDF generado con tamaño: ' + pdfDataUri.length + ' caracteres</p>';
                output.innerHTML += '<p>📋 Prefijo: ' + pdfDataUri.substring(0, 50) + '...</p>';
                
                // 3. Crear identificador como lo hace el frontend
                const identificador = 'RIJ_' + Date.now() + '_' + Math.random().toString(36).substring(7);
                
                output.innerHTML += '<p>🆔 Identificador generado: ' + identificador + '</p>';
                
                // 4. Enviar exactamente como lo hace el frontend
                output.innerHTML += '<p>📡 Enviando al endpoint...</p>';
                
                const response = await fetch('/api/rij/convertir_pdf_imagen', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        pdf_base64: pdfDataUri,  // Enviamos el data URI completo
                        identificador: identificador
                    }),
                    credentials: 'include'
                });
                
                output.innerHTML += '<p>📨 Respuesta recibida: ' + response.status + '</p>';
                
                if (response.ok) {
                    const result = await response.json();
                    output.innerHTML += '<h3>✅ Éxito:</h3>';
                    output.innerHTML += '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
                    
                    if (result.url) {
                        output.innerHTML += '<h3>🖼️ Imagen generada:</h3>';
                        output.innerHTML += '<img src="' + result.url + '" style="max-width: 400px; border: 1px solid #ccc;">';
                    }
                } else {
                    const errorText = await response.text();
                    output.innerHTML += '<h3>❌ Error del servidor:</h3>';
                    output.innerHTML += '<pre>' + errorText + '</pre>';
                }
                
                // 5. Simular el guardado en localStorage como hace el frontend
                localStorage.setItem('ultimo_pdf_rij', pdfDataUri);
                localStorage.setItem('usuario_identificador_rij', identificador);
                localStorage.setItem('rij_pdf_procesado', 'true');
                
                output.innerHTML += '<p>💾 Datos guardados en localStorage</p>';
                
            } catch (error) {
                output.innerHTML += '<h3>❌ Error JavaScript:</h3>';
                output.innerHTML += '<pre>' + error.toString() + '</pre>';
                console.error('Error completo:', error);
            }
        });
    </script>
</body>
</html>
