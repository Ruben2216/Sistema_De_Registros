<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Importar Imagen</title>
</head>
<body>
    <h1>Prueba de Importación de Imágenes</h1>
    
    <button onclick="probarImportacion()">Probar Importar Imagen</button>
    <button onclick="mostrarImagenesDisponibles()">Ver Imágenes Disponibles</button>
    
    <div id="resultado"></div>
    <div id="imagenes"></div>
    
    <script>
        function mostrarImagenesDisponibles() {
            fetch('/api/rij/imagenes_disponibles', {
                method: 'GET',
                credentials: 'include'
            })
            .then(response => response.json())
            .then(data => {
                console.log('Imágenes disponibles:', data);
                document.getElementById('imagenes').innerHTML = '<h3>Imágenes disponibles:</h3><pre>' + JSON.stringify(data, null, 2) + '</pre>';
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('imagenes').innerHTML = '<h3>Error:</h3>' + error.message;
            });
        }
        
        function probarImportacion() {
            fetch('/api/rij/importar_imagen', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ nombre_archivo: 'plantilla_rij.png' }),
                credentials: 'include'
            })
            .then(response => response.json())
            .then(data => {
                console.log('Resultado importación:', data);
                if (data.success) {
                    document.getElementById('resultado').innerHTML = '<h3>Éxito:</h3><p>Imagen importada: ' + data.url + '</p><img src="' + data.url + '" width="200">';
                } else {
                    document.getElementById('resultado').innerHTML = '<h3>Error:</h3>' + data.error;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('resultado').innerHTML = '<h3>Error:</h3>' + error.message;
            });
        }
        
        // Cargar imágenes disponibles al iniciar
        mostrarImagenesDisponibles();
    </script>
</body>
</html>
